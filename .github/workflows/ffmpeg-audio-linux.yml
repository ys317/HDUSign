name: Build portable audio FFmpeg (Linux)

on:
  push:
    branches: [codex/ffmpeg-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-audio:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config libgnutls28-dev gnupg xz-utils binutils
      - name: Fetch pinned official source
        run: python tools/ffmpeg-build/fetch_sources.py
      - name: Build audio-only LGPL FFmpeg with GnuTLS
        run: bash tools/ffmpeg-build/build_linux.sh
      - name: Install certificate test tooling
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Verify audio and HTTPS on the disposable runner
        run: python tools/ffmpeg-build/verify.py --tls-ci
      - name: Package binary and corresponding source together
        run: python tools/ffmpeg-build/package.py
      - name: Upload verified FFmpeg bundle
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-8.1.2-hdusign-audio-linux64
          path: tools/ffmpeg-build/dist/*
          if-no-files-found: error
          retention-days: 30
