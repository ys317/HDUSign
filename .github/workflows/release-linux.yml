name: Build and release Linux portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload Linux release assets to GitHub Releases"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Target release tag (defaults to v<__version__>)"
        type: string
        required: false
        default: ""
      notes_file:
        description: "Release notes markdown path when creating a new release"
        type: string
        required: false
        default: "docs/releases/v2.4.1.md"

permissions:
  contents: read

jobs:
  ffmpeg-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config libgnutls28-dev gnupg xz-utils binutils
      - name: Fetch pinned FFmpeg source
        run: python tools/ffmpeg-build/fetch_sources.py
      - name: Build audio-only LGPL FFmpeg with GnuTLS
        run: bash tools/ffmpeg-build/build_linux.sh
      - name: Install certificate test tooling
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Verify FFmpeg audio and HTTPS
        run: python tools/ffmpeg-build/verify.py --tls-ci
      - name: Package FFmpeg binary and corresponding source
        run: python tools/ffmpeg-build/package.py
      - name: Upload Linux FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux64
          path: tools/ffmpeg-build/dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: ffmpeg-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install Qt, audio, and CJK font system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libglx-mesa0 libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 \
            libpulse0 libgnutls30 fonts-noto-cjk fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.2
      - name: Install Playwright Chromium and OS dependencies
        run: |
          python -m playwright install chromium
          sudo "$(command -v python)" -m playwright install-deps chromium
      - name: Run unit tests on Linux
        run: |
          PYTHONPATH="$PWD:$PWD/tests" QT_QUICK_BACKEND=software xvfb-run -a \
            python -m unittest -v \
            tests.test_accounts tests.test_appearance tests.test_attendance tests.test_audio \
            tests.test_browser_cleanup tests.test_captcha tests.test_captcha_boost \
            tests.test_captcha_browser tests.test_desktop_controller tests.test_diagnostics \
            tests.test_early_codes tests.test_incremental_build tests.test_lessons \
            tests.test_live tests.test_live_courses tests.test_live_monitor \
            tests.test_location tests.test_login_auth tests.test_matcher \
            tests.test_media tests.test_multi_account tests.test_multi_qml \
            tests.test_multiple_reservations tests.test_notification_context \
            tests.test_notification_only tests.test_prepared_browser tests.test_qml_desktop \
            tests.test_release tests.test_reliability tests.test_replay_metrics \
            tests.test_reservation_webhooks tests.test_runtime \
            tests.test_sign_diagnostics tests.test_signing_integration
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import hdusign; print('v' + hdusign.__version__)")
          test "${GITHUB_REF_NAME}" = "$VERSION"
      - name: Fetch pinned ASR model
        run: python tools/fetch_asr_model.py
      - name: Download Linux FFmpeg artifact
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux64
          path: build/ffmpeg-audio-linux
      - name: Build and verify Linux portable release
        run: |
          QT_QUICK_BACKEND=software xvfb-run -a \
            python tools/release.py build \
            --ffmpeg-bundle build/ffmpeg-audio-linux/ffmpeg-8.1.2-hdusign-audio-linux64.tar.gz
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HDUSign-linux-x64
          path: |
            dist/releases/v*/*
            build/runtime-v*-linux-x64.json
            build/release-v*-linux-x64-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish-linux:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download built Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: HDUSign-linux-x64
          path: release-assets
      - name: Upload or create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          VERSION=$(python3 -c "import re, pathlib; print('v' + re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('hdusign/__init__.py').read_text()).group(1))")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            DRAFT_FLAG=""
          else
            TAG="${INPUT_TAG:-$VERSION}"
            DRAFT_FLAG="--draft"
          fi
          ARCHIVE="release-assets/dist/releases/$VERSION/HDUSign-$VERSION-linux-x64.tar.gz"
          SOURCE="release-assets/dist/releases/$VERSION/ffmpeg-8.1.2-hdusign-audio-linux64-source.tar.xz"
          SUMS="release-assets/dist/releases/$VERSION/SHA256SUMS-linux-x64.txt"
          test -f "$ARCHIVE" && test -f "$SOURCE" && test -f "$SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$SOURCE" "$SUMS" --clobber
          else
            test -f "$NOTES_FILE"
            gh release create "$TAG" "$ARCHIVE" "$SOURCE" "$SUMS" \
              --title "HDUSign $TAG" \
              --notes-file "$NOTES_FILE" \
              $DRAFT_FLAG
          fi
