# ====== 音频采集 ======
device: null # 输出设备(扬声器)名称关键词, null=系统默认; 用 `python -m hdusign devices` 查看列表
chunk_seconds: 0.25 # 每次送给 ASR 的音频块长度

# ====== 启动音频诊断 ======
diagnostics:
  enabled: true # 可在设置中关闭；最多保存启动阶段 180 秒音频

# ====== 课堂 ======
live_url: "" # 选择直播课程后自动填写；也可在设置中手动填写
live_audio:
  enabled: true # 默认直接接收直播音频；设置中可关闭并使用电脑声音
location: # 「设置」页可获取 Windows 当前位置或手动填写，请核对后保存
  lat: 30.314732
  lng: 120.343727

# ====== ASR 引擎 ======
asr:
  model_dir: models/sherpa-onnx-streaming-zipformer-zh-int8-2025-06-30
  num_threads: 1 # 实时识别默认单线程，降低持续 CPU 占用
  provider: cpu # 迁到 N 卡机器后改 cuda, 并配合 provider=cuda 的 sherpa-onnx 版本
  hotwords: []  # 可选实验项；热词也可能改错数字或把讲课内容识别成签到提示
  # 可试用 [签到, 签到码, 签个到, 点名, 点个名, 点个到, 打卡]，先用本人课堂录音核对错码和误报
  hotwords_score: 2.0   # 热词偏置强度；空列表使用默认贪心解码

# ====== 匹配规则 ======
# 文本会先归一化(去标点/空格/大小写), 所以规则直接写原文即可;
# ASR 常见误写(如 "签到"->"签倒")建议作为变体加进 strong 提高召回。
rules:
  strong:                # 命中任一即告警(高优先级); "re:" 开头按正则匹配
    - 签到
    - 签倒
    - 点名
    - 打卡
    - 签个到
    - 点个到
    - 点个名
    - 报个到
    - 报个名
    - 上课啦
    - 打开上课啦
    - 手机打开
    - 打开手机
    - 钉钉
    - 点到
    - 're:(?<![0-9一二三四五六七八九十两节])点到'   # 兼容保留；普通关键词“点到”已可直接触发
  weak_groups:           # 每组内所有词同时出现才告警(中优先级)
    - [扫, 码]
    - [扣, 1]
    - [扣, 一]
    - [链接, 发]
  semantic:              # embedding 语义匹配(fastembed, 本地推理)
    enabled: false      # 可在界面开启；当前候选模板尚未完成独立课堂的误报验证
    model: BAAI/bge-small-zh-v1.5
    threshold: 0.70      # 候选阈值；提高可减少误报，也可能漏掉提示
    min_length: 6        # 太短的句子("我们""到首先")与任何模板都相似, 不参与语义匹配
    templates:
      - 请大家拿出手机签到
      - 现在开始点名
      - 我们点一下名
      - 大家签一下到
      - 打开上课啦签到一下
      - 签到码是

# ====== 签到码监控 ======
code_watch:
  window_seconds: 60 # 触发签到告警后继续监听/输出文本的时长
  context_seconds: 30 # 告警时回看的上下文范围
  code_dedup: 60         # 同一个码在该时间内不重复报
  standalone_code: true  # 未触发时, 独立的4位数字短句(如"二三三零")也直接报码
  early_code: true       # 数字后已出现非数字内容或完整重复报码时，可在整句结束前确认
  early_stable_seconds: 0.4 # 至少两次实际解码一致；只有四位尾串时仍等待完整结果
  log_file: codes.jsonl

# ====== 全自动签到 ======
auto_sign:
  enabled: true            # 听到签到码后自动打开浏览器完成签到(依赖 browser_profile 登录态)
  timeout_seconds: 180  # 签到任务总时限（30–1800 秒）；提交后为手动验证码与签到结果最多等待 120 秒
  prewarm_browser: true  # 启动监控时打开签到页，确认码后才输入并提交
  captcha_trajectory: true  # 可关闭的轨迹增强；人工接手时停止注入，样本按账号保存

# ====== 浏览器网络 ======
browser:
  bypass_proxy: false      # 系统代理(如 Clash)导致 skl.hdu.edu.cn 打不开时改为 true
  ipv4_only: false         # 校内域名走 IPv6 握手失败时改为 true, 浏览器改用 IPv4 连接

# ====== 告警 ======
alert:
  log_file: alerts.jsonl
  dedup_seconds: 90 # 相同文本在该时间内不重复告警
  webhook: # 企业微信群机器人: 群设置->群机器人->添加->复制 Webhook 地址
    url: "" # 可选；填写完整的企业微信机器人 Webhook 地址，留空则不推送
